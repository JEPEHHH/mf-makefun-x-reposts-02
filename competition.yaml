# makefun-x-reposts-02, "Get the most reposts and likes on make.fun's newest X posts": an X post contest on a pool of
# make.fun's own posts, makefun-x-reposts-01's at $500 and with likes counted. An entrant makes posts of its own on X,
# from one public account, each a quote of or a direct reply to a different post of the pool (every post @makefunai
# makes on X from the floor post `pool.from` on, a post make.fun makes during the window joining the moment it is made),
# each post's own words carrying make.fun (a link or written out) or a tag of @makefunai and the entrant's play code, and
# the entry's repository names up to 15 of them in POSTS.json. Places go by the reposts and the quotes, 2 points each,
# and the likes, 1 point each, of all the entry's posts, added up, as the house reads each post through FxTwitter's
# public read after the final's lock, the highest first, for the catalogue's $500 fifty-place table. Metric (program/v1
# + harness.entry_link on X naming `counts`, `rank_by` and `pool`), no judge, a sealed scorer of its own. Validated by
# server/competitions/load.ts against contracts/competition.ts; seeded by `npm run db:seed`.
#
# OPENED on the owner's word (2026-11-25, about 05:35Z, in the chat, word for word): "let's up it to $500  too running
# for 72h", said of makefun-x-reposts-01 once it was live, and then (about 05:40Z, word for word): "also let's make it
# give points for likes too for better algo boosting and ratios". makefun-x-reposts-01 was seeded open on makefun-prod
# at 2026-11-25T05:31Z (release 1962375f) on the $250 fifty-place table, hidden, its $250 escrow lock never approved and
# no entry taken; its directory is frozen from its opening (new-bounty SKILL.md section 8, sub-step 12: "A fix is a new
# slug"), so this slug replaces it: the same bounty, copied from competitions/makefun-x-reposts-01/ byte for byte and
# then changed only in its slug, its money, its dates, its weights (the likes) and the words that state them. Status
# open and visibility public, its block in production's seed catalogue and its tests/unit/catalogue.test.ts
# OPENED_IN_TURN row; no review draft came first: the owner's two lines above are the go, on the copy he had already
# opened. No escrow locks until the owner approves its lock on /admin (.cosmos/rules/escrow-approval.mdc): once
# production serves it open the fund-at-open job records it awaiting the owner's Approve on /admin, and until the lock
# lands the bounty is hidden and takes no entry. From the opening no byte of this directory changes (a fix is a new
# slug, makefun-x-reposts-03). Retiring makefun-x-reposts-01's row is not this directory's: it never took an entry.
#
# The owner's earlier answers, which carry over from makefun-x-reposts-01, word for word:
# The ask (2026-11-24): "stand up a new bounty for make.fun where we reward X accounts that get the most reweets, like
# across our 5 newest posts on X - if a new post is made during contest, then the points of previous post still count,
# but the new post becomes valuable for them to farm too."
# The money and the window (the decision tray, 2026-11-24): "$250, top 50, 72 h", now $500 on his word above with the
# 50 places and the 72 hours kept: $500 on the catalogue's "$500 fifty-place table" (CATALOGUE_TABLES, FIFTY_500_TABLE,
# the $250 fifty-place table doubled): $100 / $60 / $30, $10 each for 4th to 10th and $6 each for 11th to 50th; 72 hours
# of entries ("running for 72h").
# How many posts an account counts (the decision tray, 2026-11-25): "Best 15 posts", the option that read "Nearly every
# post make.fun makes during the window counts. About 2.6 h at 2,000 entrants (4.6 h worst, over your 4 h line); up to
# about 22 h at 10,000." So pool.posts_max 15: a list names at most 15 posts, and once the pool holds more than 15 the
# entrant picks which 15 to tie posts to. The owner took it knowing it breaks two of his lines, the final's 4-hour worst
# case at 2,000 entries and the 4-hour field line at 10,000: his words are this slug's named exception where the
# loader's ceiling expects one (server/competitions/final-ceiling.ts FINAL_CEILING_GRANDFATHERED and
# FINAL_FIELD_GRANDFATHERED, each row quoting them, makefun-x-reposts-01's figures; the line loosened for no other
# bundle); without those rows the loader refuses this competition.yaml (finalCeilingLoadIssue).
# The go of makefun-x-reposts-01 (2026-11-25): "let's get this landed and shipped to prod pls".
#
# The design is makefun-x-reposts-01's (its header's items 1 to 10, the manager's plan item 3), unchanged but for:
#   1. The slug makefun-x-reposts-02, no post-x- prefix (server/releases/home-slugs.ts SOCIAL_POST_SLUG_PREFIXES): a
#      bundle of its own with a meme of its own.
#   2. The pool, by the same rule: harness.entry_link.pool {author: makefunai, author_id: 2117745311074693120, from,
#      posts_max}; a pool post is one whose author is X user 2117745311074693120 (the id, never the handle), whose id
#      is at or above `from` as numbers, and which is not a reply to another account (its originals, its quotes and
#      its self-thread continuations; never its plain reposts nor its replies to other accounts). The floor is the
#      5th-newest such post at the opening, so the pool opens on make.fun's 5 newest posts and every post make.fun makes
#      in the window joins it on its own, the earlier ones counting on. scripts/competitions/x-pool-floor.ts re-derives
#      the floor by that rule (FxTwitter v2's profile timeline by the author's id, own posts and self-thread
#      continuations kept, sorted by id as numbers, the n-th newest at the instant), never by hand.
#   3. The 5 pool posts, newest first, as FxTwitter read them 2026-11-25T05:34:50Z (scripts/competitions/x-pool-floor.ts
#      --author-id 2117745311074693120 --author makefunai --at that instant; 95 statuses over 5 pages; the floor the
#      last one):
#        2125375203744391226  2026-11-24T23:45:10Z  original
#        2125247026728235268  2026-11-24T15:15:51Z  self-thread continuation
#        2125246707512553850  2026-11-24T15:14:34Z  original
#        2125053991293784431  2026-11-24T02:28:47Z  self-thread continuation
#        2125053632605196760  2026-11-24T02:27:22Z  original
#      so pool.from 2125053632605196760, the same floor makefun-x-reposts-01's go-live read at 2026-11-25T03:09Z (make.fun
#      made no own post between the two reads). The opening is after this read: a post make.fun makes between the read
#      and the opening joins the pool all the same, its id above the floor.
#   4. The weights, the owner's "also let's make it give points for likes too for better algo boosting and ratios":
#      harness.entry_link.rank_by and reference/gate.json's rank_by {reposts: 2, quotes: 2, likes: 1}, so the score is
#      the sum over the entry's posts of 2 x reposts + 2 x quotes + likes. A repost or a quote is worth two likes, after
#      the weights X published for its own ranking: the heavy ranker of X's "For You" timeline sums its predicted
#      engagements with scored_tweets_model_weight_fav 0.5 and scored_tweets_model_weight_retweet 1.0 (the weights as of
#      April 5, 2023, https://github.com/twitter/the-algorithm-ml/blob/main/projects/home/recap/README.md, read
#      2026-11-25), so a repost weighs twice a like there. Those weights apply to the probability a viewer engages, not to
#      a post's counts, and X may have moved them since: the ratio is taken from them, never claimed to be X's ranking.
#      A quote weighs as a repost (a repost with words; X's list names no quote apart). Views and replies weigh nothing:
#      the owner named likes alone. A rank_by weight is a whole number from 1 (contracts/competition.ts
#      ENTRY_LINK_RANK_BY_WEIGHT_MAX), so the 2:1 ratio is written 2 and 1. The sealed scorer is makefun-x-reposts-01's
#      byte for byte: scorer/posts.ts already sums every count gate.json's rank_by names at its weight (rowScoreOf, over
#      COUNT_KEYS, contracts/entry-link-counts.ts countsScoreOf mirrored), so only reference/gate.json moved, and with it
#      reference_sha256. Its format tag stays "makefun-x-reposts-01/gate/v1", the scorer's GATE_FORMAT, since the scorer is
#      the same bytes. Measured on production's last X counts final (post-x-the-agent-builds-a-game-from-20261122-1709,
#      1,170 posts, its leaderboard read 2026-11-25): 4.25 likes for each repost or quote (1,816 likes, 427 reposts and
#      quotes), so the weights would have ranked it on 546, 154, 126, 118 and 116 at the top, its 99th percentile 35 and
#      876 of 1,170 at 0 (1,062 at 0 on reposts and quotes alone): fewer ties at the bottom, and a like now earns a point.
#      Likes are the cheapest count to buy or fake, so the rules name bought, botted and self-made likes beside reposts and
#      quotes in what disqualifies.
#   5. Everything else as makefun-x-reposts-01's header says it: the entry (one per make.fun account, POSTS.json of up
#      to 15 posts, Force_Last, 20 a day and 40 in all), the tie (Quote, or Reply on the pool post itself), no photo
#      asked (post_media none), each post's own words read for make.fun, the tag and the code, posts_max 15, and X's
#      guidelines for promotions (https://help.x.com/en/rules-and-policies/x-contest-rules, read 2026-11-25).
#
# The promo assets (.cosmos/rules/makefun-promo-assets.mdc, "Promo contests and campaigns"): a video on a post ends on
# make.fun's referral end card from the press pack, the entrant's own referral code typed in, the manifest
# (https://make.fun/press/manifest.json) and its guide (https://make.fun/press/llms.txt) linked and never bundled; nothing
# scores it and no check reads it, and an admin may disqualify an entry without it. Any make.fun mark, wordmark or colour
# a photo or a video shows comes from the same press pack, used as it is, the name written make.fun. The rules and the
# starter's README.md and AGENT.md say both.
#
# The directories, makefun-x-reposts-01's:
#   competition.yaml        this file.
#   scorer/score.ts         makefun-x-reposts-01's sealed scorer, byte for byte (the same scorer_sha256): score.ts reads
#   scorer/posts.ts         /output/POSTS.json, /output/posts.counts.json and /reference/gate.json and writes exactly
#                           score and valid and one checks.json row a check; posts.ts, pure, holds the gate and the score
#                           (gateOf, gradeOf): posts_file, posts_list and posts_counts, then post_1 to post_<n>. score is
#                           contracts/entry-link-counts.ts xPostsScoreOf mirrored in BigInt (each public row's weighted
#                           counts, summed; a gone row 0) when the entry is valid.
#   reference/gate.json     the gate's limits and weights: {format: "makefun-x-reposts-01/gate/v1", posts_max: 15,
#                           file_max_bytes: 16384, url_max_chars: 2048, counts_max_bytes: 16384, rank_by {reposts: 2,
#                           quotes: 2, likes: 1}}, equal to harness.entry_link.pool.posts_max and rank_by.
#   starter/                a working entry laid out as a repository: main.ts copying POSTS.json to /output, POSTS.json
#                           holding the placeholder {"posts": ["https://x.com/<handle>/status/<id>"]}, an MIT LICENSE,
#                           README.md for the person and AGENT.md for the agent, their slug, money and score words this
#                           bundle's.
#   scoring/                the scoring stage: DESIGN.md, research.md (bound in DESIGN.md by its sha256, its weights
#                           pass added), sim.ts (the sealed-outcome adapter, driving scorer/posts.ts at this reference's
#                           weights) and cases.json (ten cases through sim.ts scoreCase, written from the adapter's own
#                           table by scripts/scoring/lib/scaffold.ts casesFileOf). No proof.json: no estimator owes one
#                           (one exact reading a post, forced by the counts), so scoring-proof and scoring-tests warn.
#
# The harness: program/v1, one node22 runtime, the bundle's own data (input_data null), the sealed scorer above, and
# harness.entry_link {file: POSTS.json, platform: x, link: make.fun, mention: "@makefunai", link_or_mention: true,
# binding: {code: true, one_account: true}, engagement: true, counts: posts.counts.json, rank_by: {reposts: 2, quotes:
# 2, likes: 1}, post_media: none, pool: {author: makefunai, author_id: "2117745311074693120", from:
# "2125053632605196760", posts_max: 15}}: the house reads POSTS.json at intake and every listed post through X's public
# embed (FxTwitter's public read where the embed gives none), every tied pool post once, refuses the entry naming the
# first post that fails, and takes the counts in its three readings (the check's at intake, the latest the dev board
# ranks on, paced by the residential proxy's daily latest share, and the deadline's after the final's lock, entry by
# entry: counts-pass.ts X_POOL_DEADLINE_PASS_WORDS, which the rules quote), as makefun-x-reposts-01's header says it.
# The likes are read in every reading already (a row carries views, likes, replies, reposts and quotes): the weights move
# no read.
#
# The leaderboard: score at index 0 (desc, precision 0, primary: a whole number shown exact, EXACT_RANK_COLUMNS) and
# valid at index 1 (desc), both scored, no tie_break_index: an exact tie goes to the earlier receipt alone. No feed.
#
# The dates, re-dated from makefun-x-reposts-01's by scripts/redate-bundle.ts (never escrowed, no production row of
# it), the window's length kept: opens_at and dev's start 2026-11-25T07:30:00Z, on the half hour: the root's pick was
# 07:00Z, which is bounty-entrants-01's deadline, so it moved to the next half hour that clears every other opening and
# deadline by 30 minutes, with room for the deploys; the deadline and dev's end 2026-11-28T07:30:00Z (72 hours, the owner's
# "running for 72h"); the final from the deadline itself (an undrawn escrowable final starts at the deadline,
